name: ci

on:
  push:

permissions:
  contents: read
  id-token: write

env:
  GO_VERSION: "1.25"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: ./.github/actions/setup-vhs
      - run: make test

  cover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: ./.github/actions/setup-vhs
      - run: make cover
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/profile-merged.txt
      - uses: codecov/codecov-action@v5
        with:
          disable_search: true
          files: coverage/profile-merged.txt
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@v9

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GOOGLE_PROJECT }}
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
      - name: Install sops
        run: |
          wget https://github.com/getsops/sops/releases/download/v3.11.0/sops-v3.11.0.linux.amd64 -O sops
          chmod +x sops
          sudo mv sops /usr/local/bin/
      - name: make e2e
        run: |
          env $(sops decrypt --input-type dotenv --output-type dotenv .env.enc | xargs) \
            make e2e
