name: release

on:
  push:
    tags:
      - v*.*.*

permissions:
  contents: read
  id-token: write

jobs:
  # Build and push container image to Google Artifact Registry
  image:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GOOGLE_PROJECT }}
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GOOGLE_PROJECT }}
          skip_install: true
      - run: gcloud auth configure-docker ${{ vars.GOOGLE_ARTIFACT_REGISTRY_HOST }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ vars.GOOGLE_ARTIFACT_REGISTRY_REPO_URI }}/patrolbot
          flavor: |
            latest=false
          tags: type=semver,pattern={{version}}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy PatrolBot service on Google Cloud Run
  deploy:
    runs-on: ubuntu-latest
    needs: [image]
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GOOGLE_PROJECT }}
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
      - uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: patrolbot
          region: ${{ vars.GOOGLE_REGION }}
          image: ${{ needs.image.outputs.tag }}
          flags: >
            --service-account=${{ vars.GOOGLE_SERVICE_ACCOUNT }}
          secrets: |-
            PATROLBOT_DISCORD_TOKEN=discord-token:latest
            PATROLBOT_WIKIS_ZWEN_AUTH_PASSWORD=botpassword-zwen:latest
            PATROLBOT_WIKIS_TESTWIKI_AUTH_PASSWORD=botpassword-zwen:latest

  # Register Discord bot commands
  register:
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GOOGLE_PROJECT }}
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
      - uses: ./.github/actions/setup-sops
      - name: make register
        run: |
          env $(sops decrypt --input-type dotenv --output-type dotenv .env.enc | xargs) \
            make register
    