# Needed until vhs-action is fixed: https://github.com/charmbracelet/vhs-action/issues/459
name: Setup VHS
description: Installs VHS and its dependencies (ffmpeg, ttyd)
runs:
  using: composite
  steps:
    - name: Install ffmpeg
      shell: bash
      run: |
        sudo apt update
        sudo apt install -y ffmpeg

    - name: Install ttyd
      shell: bash
      run: |
        wget https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64 -O ttyd
        chmod +x ttyd
        sudo mv ttyd /usr/local/bin/

    - name: Install VHS
      shell: bash
      run: |
        go install github.com/charmbracelet/vhs@latest
