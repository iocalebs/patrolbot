# yaml-language-server: $schema=https://golangci-lint.run/jsonschema/golangci.jsonschema.json
version: "2"
linters:
  default: all

  disable:
    - depguard
    - exhaustruct
    - nlreturn
    - wsl

  settings:
    mnd:
      ignored-functions:
        - ^os\.WriteFile
        - ^os\.MkdirAll
    varnamelen:
      ignore-decls:
        - w http.ResponseWriter

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - dupl
          - funlen
      - path: tools/.*\.go
        linters:
          - err113
          - wrapcheck

issues:
  fix: true
