# yaml-language-server: $schema=https://golangci-lint.run/jsonschema/golangci.jsonschema.json
version: "2"
linters:
  default: all

  disable:
    - depguard
    - nlreturn
    - wsl

  settings:
    exhaustruct:
      allow-empty: true
      exclude:
        - ^github.com/spf13/cobra\.Command$
    goconst:
      ignore-string-values:
        - foo #nonsense value commonly used in tests to pass invalid string
    varnamelen:
      ignore-names:
        - w # http.ResponseWriter
        - tc # table test case

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - dupl
          - funlen
      - path: tools/.*\.go
        linters:
          - err113
          - wrapcheck

issues:
  fix: true
