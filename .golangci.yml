# yaml-language-server: $schema=https://golangci-lint.run/jsonschema/golangci.jsonschema.json
version: "2"
linters:
  default: all

  disable:
    - depguard
    - wsl

  settings:
    exhaustruct:
      allow-empty: true

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - funlen

issues:
  fix: true
