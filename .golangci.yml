# yaml-language-server: $schema=https://golangci-lint.run/jsonschema/golangci.jsonschema.json
version: "2"
linters:
  default: all

  disable:
    - depguard
    - wsl

  settings:
    exhaustruct:
      allow-empty: true
    nlreturn:
      block-size: 2

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - funlen
      - path: tools/.*\.go
        linters:
          - err113
          - wrapcheck

issues:
  fix: true
